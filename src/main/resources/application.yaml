spring:
  application:
    name: clothes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clothes}
    username: ${DB_USERNAME:clothes}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    issuer: ${JWT_ISSUER:lemonadex-clothes}
    audience: clothes-api
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: '%5p [requestId:%X{requestId:-}]'
