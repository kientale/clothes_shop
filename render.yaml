# Render Blueprint for the Spring Boot backend (Dashboard > New > Blueprint). Values marked sync: false are
# asked for when the Blueprint is created; the frontends are deployed separately on Vercel.
services:
  - type: web
    name: trankien-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STOREFRONT_URL
        sync: false
      - key: UPLOADS_PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false
      # Render's proxy sits in front of the app: rate limits must see the client address, not the proxy's.
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/seed
