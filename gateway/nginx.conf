worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Log metadata only: never log Authorization or request bodies.
    log_format requests '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout requests;
    server_tokens off;
    default_type application/json;
    client_max_body_size 16k;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    upstream clothes_backend {
        server backend:8080;
        keepalive 16;
    }

    server {
        listen 80;

        # Public routes; input validation and credentials are handled by Spring Security.
        location = /api/v1/auth/register {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/backend-proxy.conf;
        }
        location = /api/v1/auth/login {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/backend-proxy.conf;
        }

        # JWT + current database permissions are checked by the backend on every request.
        location /api/v1/auth/ {
            include /etc/nginx/backend-proxy.conf;
        }
        location /api/v1/admin/ {
            include /etc/nginx/backend-proxy.conf;
        }
        location = /actuator/health {
            include /etc/nginx/backend-proxy.conf;
        }

        error_page 429 = @rate_limited;
        error_page 502 504 = @unavailable;
        location @rate_limited {
            add_header X-Request-Id $request_id always;
            add_header Retry-After 60 always;
            return 429 '{"success":false,"code":"RATE_LIMITED","message":"Too many authentication requests","data":null,"timestamp":"$time_iso8601","requestId":"$request_id"}';
        }
        location @unavailable {
            add_header X-Request-Id $request_id always;
            return 502 '{"success":false,"code":"UPSTREAM_UNAVAILABLE","message":"Backend is temporarily unavailable","data":null,"timestamp":"$time_iso8601","requestId":"$request_id"}';
        }
        location / {
            add_header X-Request-Id $request_id always;
            return 404 '{"success":false,"code":"RESOURCE_NOT_FOUND","message":"Endpoint was not found","data":null,"timestamp":"$time_iso8601","requestId":"$request_id"}';
        }
    }
}
