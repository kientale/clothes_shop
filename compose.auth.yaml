# docker compose -f compose.yaml -f compose.auth.yaml up -d --build
services:
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clothes
      DB_USERNAME: ${DB_USERNAME:-clothes}
      DB_PASSWORD: ${DB_PASSWORD:-clothes_local}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 UTF-8 bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/backend-proxy.conf:/etc/nginx/backend-proxy.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
